<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>body{margin:0}</style></head><body>
<title>Stabilizer Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: top bar | code list (folding groups) | picture with tabs | details (folding sections, can be hidden).
   One sans family for everything; mono only for Pauli strings and matrices.
   Colour carries meaning only: X = red, Z = blue, Y/mixed = violet, lit check = amber, correction = green. */
:root {
  --paper: #f2f3f5; --panel: #ffffff; --ink: #171a20; --muted: #5f6775; --rule: #d9dde4; --grid: #eceef2;
  --x: #c4424f; --z: #2a62c9; --y: #8152c2; --lit: #e89b00; --chain: #b06a00; --ok: #2f8a4f; --bad: #c4424f; --sel: #171a20;
  --xbg: #f6dde0; --zbg: #dbe5f7; --ybg: #e9def6; --litbg: #fdecc4;
  --heat0: #ffffff; --heat1: #c4424f;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #111318; --panel: #191c23; --ink: #e7e9ee; --muted: #9aa2b1; --rule: #2c313c; --grid: #20242d;
  --x: #ec6b75; --z: #6d9bf2; --y: #ad86ea; --lit: #ffc23d; --chain: #ffb547; --ok: #57c27c; --bad: #ec6b75; --sel: #ffffff;
  --xbg: #45252b; --zbg: #22324f; --ybg: #352a4a; --litbg: #4a3a12;
  --heat0: #191c23; --heat1: #ec6b75; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #111318; --panel: #191c23; --ink: #e7e9ee; --muted: #9aa2b1; --rule: #2c313c; --grid: #20242d;
  --x: #ec6b75; --z: #6d9bf2; --y: #ad86ea; --lit: #ffc23d; --chain: #ffb547; --ok: #57c27c; --bad: #ec6b75; --sel: #ffffff;
  --xbg: #45252b; --zbg: #22324f; --ybg: #352a4a; --litbg: #4a3a12;
  --heat0: #191c23; --heat1: #ec6b75; color-scheme: dark; }
:root[data-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 24px; }
h1, h2, h3 { margin: 0; font-weight: 600; }
button, select, input { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--z); outline-offset: 2px; }

/* top bar */
.topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.topbar h1 { font-size: 1.15rem; letter-spacing: -0.01em; }
.topbar .spacer { flex: 1; }
.btn { border: 1px solid var(--rule); background: var(--panel); border-radius: 6px; padding: 4px 10px; font-size: 0.85rem; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.btn:disabled { opacity: 0.45; cursor: default; }
.chip { border: 1px solid var(--rule); background: var(--panel); border-radius: 6px; padding: 4px 10px; font-size: 0.85rem; cursor: pointer; }
.chip:disabled { opacity: 0.45; cursor: default; }

.app { display: grid; grid-template-columns: 210px minmax(0, 1fr) 320px; gap: 12px; align-items: start; }
.app.nodetails { grid-template-columns: 210px minmax(0, 1fr); }
.app.nodetails .inspector { display: none; }
@media (max-width: 1100px) { .app, .app.nodetails { grid-template-columns: 190px minmax(0, 1fr); } .inspector { grid-column: 1 / -1; } }
@media (max-width: 720px) { .app, .app.nodetails { grid-template-columns: minmax(0, 1fr); } }
.box { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; }

/* code list: one folding group per family */
.codes { padding: 6px; max-height: 84vh; overflow: auto; }
.fam { border-bottom: 1px solid var(--grid); }
.fam:last-child { border-bottom: 0; }
.fam summary { cursor: pointer; padding: 7px 8px; font-size: 0.88rem; font-weight: 600; list-style: none; display: flex; justify-content: space-between; align-items: center; }
.fam summary::-webkit-details-marker { display: none; }
.fam summary::after { content: "+"; color: var(--muted); font-weight: 400; }
.fam[open] summary::after { content: "–"; }
.fam summary small { color: var(--muted); font-weight: 400; margin-left: 6px; }
.fam button { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; background: none;
  border: 0; border-radius: 5px; padding: 4px 8px 4px 16px; font-size: 0.86rem; cursor: pointer; }
.fam button span:last-child { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
.fam button:hover { background: var(--grid); }
.fam button[aria-current="true"] { background: var(--ink); color: var(--panel); }
.fam button[aria-current="true"] span:last-child { color: var(--panel); opacity: 0.8; }
.fam > div { padding-bottom: 6px; }
@media (max-width: 720px) { .codes { max-height: 40vh; } }

/* board */
.board { padding: 0 10px 10px; min-width: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 2px 18px; border-bottom: 1px solid var(--rule); margin: 0 -10px 8px; padding: 0 12px; }
.tabs button { border: 0; background: none; padding: 9px 0 7px; font-size: 0.9rem; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: 0.85rem; margin-bottom: 8px; }
.toolbar label { display: inline-flex; gap: 5px; align-items: center; color: var(--muted); }
.toolbar .spacer { flex: 1; }
select { font-size: 0.85rem; border: 1px solid var(--rule); border-radius: 6px; padding: 4px 6px; background: var(--panel); }
.menu { position: relative; }
.menu > summary { list-style: none; }
.menu > summary::-webkit-details-marker { display: none; }
.menu[open] > summary { border-color: var(--ink); }
.menu .pop { position: absolute; z-index: 5; top: calc(100% + 4px); left: 0; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px;
  padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 190px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.14); }
.menu .pop label { color: var(--ink); cursor: pointer; white-space: nowrap; }

.stage { position: relative; background: var(--panel); border-radius: 6px; border: 1px solid var(--rule); overflow: hidden; }
.stage svg { display: block; width: 100%; height: min(68vh, 660px); touch-action: none; cursor: grab; }
.hint { font-size: 0.82rem; color: var(--muted); margin: 6px 0 0; }
/* legend: sits on the picture, top right, and folds away */
.legend { position: absolute; top: 8px; right: 8px; z-index: 2; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--rule);
  border-radius: 6px; font-size: 0.78rem; max-width: 210px; }
.legend summary { cursor: pointer; padding: 3px 8px; list-style: none; display: flex; justify-content: space-between; gap: 12px; color: var(--muted); }
.legend summary::-webkit-details-marker { display: none; }
.legend summary::after { content: "+"; } .legend[open] summary::after { content: "–"; }
.legend ul { list-style: none; margin: 0; padding: 2px 8px 6px; display: flex; flex-direction: column; gap: 3px; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 2px; vertical-align: -1px; margin-right: 6px; }

/* svg pieces */
.gen { cursor: pointer; }
.gen.X { fill: var(--x); stroke: var(--x); } .gen.Z { fill: var(--z); stroke: var(--z); } .gen.mixed { fill: var(--y); stroke: var(--y); }
.qubit { fill: var(--panel); stroke: var(--ink); cursor: pointer; }
.qlabel { font-family: var(--font-mono); font-weight: 600; fill: var(--ink); pointer-events: none; text-anchor: middle; dominant-baseline: central; }
.letter, .loglabel, .anclabel { font-family: var(--font-mono); font-weight: 600; pointer-events: none; text-anchor: middle; dominant-baseline: central; }
.litmark { fill: none; stroke: var(--lit); pointer-events: none; }
.torusbox { fill: none; stroke: var(--muted); stroke-dasharray: 0.3 0.3; }

/* matrix + written panels */
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 12px; max-height: 72vh; overflow: auto; }
.panel h3 { font-size: 0.95rem; margin: 4px 0 6px; }
.mtable { border-collapse: separate; border-spacing: 0; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.mtable th, .mtable td { min-width: 22px; height: 22px; padding: 0 3px; text-align: center; font-size: 0.75rem; border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); }
.mtable.small th, .mtable.small td { min-width: 12px; height: 12px; font-size: 0.55rem; padding: 0; }
.mtable thead th { position: sticky; top: 0; background: var(--panel); color: var(--muted); z-index: 2; cursor: pointer; font-weight: 400; }
.mtable tbody th { position: sticky; left: 0; background: var(--panel); text-align: left; padding: 0 6px; white-space: nowrap; color: var(--muted); z-index: 1; cursor: pointer; font-weight: 400; }
.mtable td.X { background: var(--xbg); color: var(--x); } .mtable td.Z { background: var(--zbg); color: var(--z); } .mtable td.Y { background: var(--ybg); color: var(--y); }
.mtable td.one { font-weight: 600; }
.mtable tr.lit th, .mtable tr.lit td.syn { background: var(--litbg); color: var(--ink); }
.mtable tr.sel th { outline: 2px solid var(--ink); outline-offset: -2px; }
.mtable th.errX { background: var(--x); color: #fff; } .mtable th.errZ { background: var(--z); color: #fff; } .mtable th.errY { background: var(--y); color: #fff; }
.mtable td.syn { font-weight: 600; border-left: 2px solid var(--rule); }
.written section { margin-bottom: 18px; }
.written p { margin: 0 0 8px; max-width: 72ch; }
.written pre { font-family: var(--font-mono); font-size: 0.78rem; background: var(--paper); border: 1px solid var(--rule); border-radius: 6px;
  padding: 10px; overflow: auto; max-height: 340px; margin: 0; line-height: 1.45; }
.copyrow { display: flex; justify-content: flex-end; margin-bottom: 4px; }

/* details panel: a title, then folding sections */
.inspector { padding: 12px 14px; min-width: 0; }
.inspector h2 { font-size: 1.1rem; }
.params { font-family: var(--font-mono); font-size: 0.95rem; }
.facts { color: var(--muted); font-size: 0.85rem; margin: 2px 0 8px; }
.sec { border-top: 1px solid var(--grid); }
.sec summary { cursor: pointer; padding: 8px 0; font-size: 0.88rem; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
.sec summary::-webkit-details-marker { display: none; }
.sec summary::after { content: "+"; color: var(--muted); font-weight: 400; } .sec[open] summary::after { content: "–"; }
.sec > .body { padding-bottom: 10px; font-size: 0.9rem; }
.sec p { margin: 0 0 6px; }
.pauli { font-family: var(--font-mono); font-size: 0.82rem; word-break: break-all; background: var(--paper); border-radius: 5px; padding: 6px 8px; }
.pauli .X { color: var(--x); font-weight: 600; } .pauli .Z { color: var(--z); font-weight: 600; } .pauli .Y { color: var(--y); font-weight: 600; } .pauli .I { color: var(--muted); opacity: 0.6; }
.errlist { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
.errchip { display: inline-flex; align-items: center; gap: 4px; font: 600 0.8rem var(--font-mono); border-radius: 5px; padding: 1px 3px 1px 7px; color: #fff; }
.errchip.X { background: var(--x); } .errchip.Z { background: var(--z); } .errchip.Y { background: var(--y); }
.errchip button { border: 0; background: rgba(255,255,255,0.25); color: #fff; border-radius: 4px; width: 17px; height: 17px; line-height: 15px; cursor: pointer; font-size: 0.75rem; padding: 0; }
.verdict { font-weight: 600; } .verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }
.refs { padding-left: 18px; margin: 0; font-size: 0.82rem; color: var(--muted); }
.small { font-size: 0.84rem; color: var(--muted); margin: 0; }
.row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.presets { display: flex; flex-direction: column; gap: 4px; }
.presets button, .steps button { text-align: left; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel);
  font-size: 0.84rem; padding: 4px 8px; cursor: pointer; width: 100%; }
.presets button:hover, .steps button:hover { border-color: var(--muted); }
.steps { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 3px; counter-reset: st; }
.steps button { display: flex; gap: 8px; align-items: baseline; }
.steps button::before { counter-increment: st; content: counter(st); font-size: 0.75rem; color: var(--muted); min-width: 1.2em; }
.steps button[aria-current="true"] { border-color: var(--ink); box-shadow: inset 3px 0 0 var(--lit); font-weight: 600; }
.steps button.later { color: var(--muted); }
.steptext { background: var(--paper); border-radius: 6px; padding: 8px 10px; margin: 0; }
.stepnav { display: flex; gap: 6px; margin-top: 8px; }
.stepnav button { flex: 1; }
.player { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.player input[type=range] { flex: 1 1 160px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="topbar">
  <h1>Stabilizer Atlas</h1>
  <span class="spacer"></span>
  <button class="btn" id="detailsBtn" type="button" aria-pressed="true" title="Show or hide the details panel">Details</button>
  <button class="btn" id="themeBtn" type="button" title="Switch between your system's theme, light and dark">Theme: auto</button>
</div>

<div class="app" id="app">
  <nav class="box codes" id="codeList" aria-label="Codes"></nav>

  <main class="box board">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-lattice" aria-selected="true">Lattice</button>
      <button role="tab" id="tab-tanner" aria-selected="false">Tanner graph</button>
      <button role="tab" id="tab-matrix" aria-selected="false">Check matrix</button>
      <button role="tab" id="tab-written" aria-selected="false">How it’s written</button>
      <button role="tab" id="tab-decode" aria-selected="false">Decode</button>
    </div>

    <div class="toolbar" id="toolbar">
      <button class="btn" id="inspectBtn" type="button" aria-pressed="true" title="When on, clicking a check shows that stabilizer">Inspect checks</button>
      <details class="menu" id="showMenu">
        <summary class="btn">Show</summary>
        <div class="pop">
          <label><input type="checkbox" id="showX" checked> X checks</label>
          <label><input type="checkbox" id="showZ" checked> Z checks</label>
          <label><input type="checkbox" id="showAnc"> Ancilla readings (0 / 1)</label>
          <label><input type="checkbox" id="showChains" checked> Error strings</label>
          <label><input type="checkbox" id="showLabels"> Qubit numbers</label>
        </div>
      </details>
      <label>Logical <select id="logSel"><option value="">none</option></select></label>
      <span class="spacer"></span>
      <button class="btn" id="clearErr" type="button">Clear errors</button>
      <button class="btn" id="resetView" type="button">Reset view</button>
    </div>

    <div class="stage" id="stage">
      <svg id="svg" role="img" aria-label="Code drawing"></svg>
      <details class="legend" id="legend" open><summary>Legend</summary><ul id="legendList"></ul></details>
    </div>
    <div class="panel" id="matrixPanel" hidden></div>
    <div class="panel written" id="writtenPanel" hidden></div>

    <p class="hint" id="hint"></p>
    <div id="playerWrap" hidden>
      <div class="player">
        <button class="btn" id="playBtn" type="button">Play</button>
        <input type="range" id="iterSlider" min="0" max="0" value="0" aria-label="BP round">
        <span class="mono" id="iterLabel"></span>
      </div>
      <svg id="spark" width="100%" height="70" aria-label="unexplained checks per round"></svg>
    </div>
  </main>

  <aside class="box inspector" id="inspector" aria-live="polite"></aside>
</div>

<script>
/*
 * decoders.js - the explorer's live decoders, in plain JavaScript.
 *
 * What this file is FOR
 * ---------------------
 * The browser explorer decodes the errors YOU click, step by step. These are
 * small, readable re-implementations of the Python decoders in qdec/:
 *
 *   lookup(code, err)            table look-up (codes with <= 13 qubits)
 *   mwpm(code, errSet, kind, p)  minimum-weight matching on the code-capacity graph
 *   bp(code, errSet, kind, ...)  min-sum belief propagation, every iteration recorded
 *   osd0(code, kind, s, llr)     ordered-statistics step when BP does not settle
 *
 * "kind" is the type of check that SEES the error: Z checks see X errors and
 * X checks see Z errors. A Y error is an X part plus a Z part, decoded separately.
 *
 * The tests (tests/test_explorer_decoders.py) run this file in Node and compare
 * it with qdec's Python decoders on random errors, so the explorer cannot drift
 * away from the library.
 *
 * Works in the browser (global QDec) and in Node (module.exports).
 */
(function (root) {
  "use strict";

  // ------------------------------------------------------------------ basics
  /** Indices of the generators of one kind ('X' or 'Z'). */
  function rowsOf(code, kind) {
    const out = [];
    code.gens.forEach((g, i) => { if (g.kind === kind) out.push(i); });
    return out;
  }

  /** Split an error {qubit: 'X'|'Y'|'Z'} into its X part and Z part (sets of qubits). */
  function splitError(err) {
    const x = new Set(), z = new Set();
    for (const q in err) {
      const l = err[q];
      if (l === "X" || l === "Y") x.add(+q);
      if (l === "Z" || l === "Y") z.add(+q);
    }
    return { x, z };
  }

  /** Syndrome bits of the rows of one kind for an error set (of the other Pauli type). */
  function syndromeOf(code, rows, errSet) {
    return rows.map((r) => code.gens[r].support.reduce((s, q) => s ^ (errSet.has(q) ? 1 : 0), 0));
  }

  /** For each qubit, which of these rows contain it (the columns of H). */
  function columns(code, rows) {
    const cols = Array.from({ length: code.n }, () => []);
    rows.forEach((r, k) => code.gens[r].support.forEach((q) => cols[q].push(k)));
    return cols;
  }

  // ------------------------------------------------------------------ lookup
  /** Lookup decoder: the stored lightest correction for this syndrome, or null. */
  function lookup(code, err) {
    if (!code.lookup) return null;
    const syn = code.gens.map((g) => {
      let s = 0;
      g.support.forEach((q, j) => { const e = err[q], l = g.letters[j]; if (e && e !== l) s ^= 1; });
      return s;
    });
    const key = syn.join("");
    const corr = code.lookup[key];
    return { key, rows: Object.keys(code.lookup).length, correction: corr || null };
  }

  // ------------------------------------------------------------------ MWPM
  /** Can matching be used: every qubit sits in at most 2 checks of this kind? */
  function isGraphLike(code, kind) {
    const rows = rowsOf(code, kind);
    return rows.length > 0 && columns(code, rows).every((c) => c.length <= 2);
  }

  /**
   * Minimum-weight perfect matching on the code-capacity graph - the same graph
   * as qdec.dem.MatchingGraph.from_check_matrix and the same search as
   * qdec.decoders.MWPMDecoder (checked by the tests):
   *   nodes: the checks of `kind` plus one boundary node B
   *   edges: one per data qubit, joining the (one or two) checks that contain it.
   *          Two qubits giving the SAME edge (e.g. both only in one boundary check)
   *          are merged: either flipping explains it, p = p1(1-p2) + p2(1-p1),
   *          so that edge is a little cheaper. weight = log((1-p)/p).
   * Shortest paths: Dijkstra. Pairing: exact dynamic programming over subsets
   * of lit checks (up to 18 lit), greedy beyond that (flagged in the result).
   */
  function mwpm(code, errSet, kind, p = 0.05) {
    const rows = rowsOf(code, kind);
    const cols = columns(code, rows);
    if (!rows.length || cols.some((c) => c.length > 2)) return null;
    const B = rows.length;                                   // boundary node id
    const emap = new Map();                                  // "u,v" -> {u, v, p, q (drawn qubit), qubits}
    cols.forEach((c, q) => {
      if (!c.length) return;
      const u = c.length === 1 ? c[0] : Math.min(c[0], c[1]);
      const v = c.length === 1 ? B : Math.max(c[0], c[1]);
      const key = u + "," + v, e = emap.get(key);
      if (e) { e.p = e.p * (1 - p) + p * (1 - e.p); e.qubits.push(q); }   // first qubit stays the drawn one
      else emap.set(key, { u, v, p, q, qubits: [q] });
    });
    const adj = Array.from({ length: B + 1 }, () => []);
    for (const e of emap.values()) {
      e.w = Math.log((1 - e.p) / e.p);
      adj[e.u].push([e.v, e.w, e.q]); adj[e.v].push([e.u, e.w, e.q]);
    }
    const syn = syndromeOf(code, rows, errSet);
    const lit = syn.map((s, k) => (s ? k : -1)).filter((k) => k >= 0);
    // Dijkstra from one lit node: distance to every node + the qubits along the path.
    // Ties are popped smallest node first, like Python's heap of (distance, node).
    const dijkstra = (src) => {
      const dist = new Array(B + 1).fill(Infinity), via = new Array(B + 1).fill(null), done = new Array(B + 1).fill(false);
      dist[src] = 0;
      for (;;) {
        let u = -1;
        for (let x = 0; x <= B; x++) if (!done[x] && dist[x] < Infinity && (u < 0 || dist[x] < dist[u])) u = x;
        if (u < 0) break;
        done[u] = true;
        for (const [v, w, q] of adj[u]) if (dist[u] + w < dist[v]) { dist[v] = dist[u] + w; via[v] = [u, q]; }
      }
      const pathTo = (t) => { const qs = []; let x = t; while (x !== src && via[x]) { qs.push(via[x][1]); x = via[x][0]; } return qs.reverse(); };
      return { dist, pathTo };
    };
    const info = lit.map((u) => dijkstra(u));
    const k = lit.length;
    let choice = [], greedy = false;
    if (k <= 18) {
      const memo = new Map();
      const best = (mask) => {
        if (mask === 0) return [0, []];
        if (memo.has(mask)) return memo.get(mask);
        const i = 31 - Math.clz32(mask & -mask);             // lowest remaining lit node
        const rest = mask & ~(1 << i);
        const [c0, ch0] = best(rest);
        let cand = [c0 + info[i].dist[B], [[i, -1]].concat(ch0)];
        let m = rest;
        while (m) {
          const j = 31 - Math.clz32(m & -m); m &= m - 1;
          const [cj, chj] = best(rest & ~(1 << j));
          const c = cj + info[i].dist[lit[j]];
          if (c < cand[0]) cand = [c, [[i, j]].concat(chj)];
        }
        memo.set(mask, cand);
        return cand;
      };
      choice = best((1 << k) - 1)[1];
    } else {
      greedy = true;
      const left = new Set(lit.map((_, i) => i));
      while (left.size) {
        const i = Math.min(...left); left.delete(i);
        let bj = -1, bc = info[i].dist[B];
        for (const j of left) if (info[i].dist[lit[j]] < bc) { bc = info[i].dist[lit[j]]; bj = j; }
        if (bj >= 0) left.delete(bj);
        choice.push([i, bj]);
      }
    }
    const correction = new Set(), pairs = [];
    let hops = 0, cost = 0;
    choice.forEach(([i, j]) => {
      const target = j === -1 ? B : lit[j];
      const qs = info[i].pathTo(target);
      hops += qs.length; cost += info[i].dist[target];
      qs.forEach((q) => (correction.has(q) ? correction.delete(q) : correction.add(q)));
      pairs.push({ a: rows[lit[i]], b: j === -1 ? null : rows[lit[j]], qubits: qs });
    });
    // the graph, for drawing: one entry per qubit = edge between its checks
    // cost = total log-weight (what was minimised); hops = qubits flipped along the paths
    return { lit: lit.map((x) => rows[x]), pairs, correction, cost, hops, greedy, edges: [...emap.values()].map((e) => ({ ends: [rows[e.u], e.v === B ? null : rows[e.v]], qubits: e.qubits })) };
  }

  // ------------------------------------------------------------------ BP
  /**
   * Normalised min-sum BP, flooding schedule - the same algorithm and the same
   * numbers as qdec.bp.MinSumBP (checked by the tests).
   */
  function bp(code, errSet, kind, p = 0.05, maxIter = 30, alpha = 0.625) {
    const rows = rowsOf(code, kind);
    const supp = rows.map((r) => code.gens[r].support);
    const s = syndromeOf(code, rows, errSet);
    const n = code.n, prior = Math.log((1 - p) / p);
    let mvc = supp.map((qs) => qs.map(() => prior));        // qubit -> check messages
    let llr = new Array(n).fill(prior);
    const guessOf = (l) => l.map((v) => (v < 0 ? 1 : 0));
    const unsatOf = (g) => supp.reduce((acc, qs, c) => acc + (((qs.reduce((t, q) => t ^ g[q], 0)) !== s[c]) ? 1 : 0), 0);
    let guess = guessOf(llr);
    const hist = { llr: [llr.slice()], guess: [guess.slice()], unsat: [unsatOf(guess)] };
    let converged = hist.unsat[0] === 0 && !s.some((v) => v);
    let it = 0;
    while (!converged && it < maxIter) {
      it += 1;
      // check -> qubit: sign = (-1)^s * product of the OTHER signs; size = alpha * min of the OTHER sizes
      const mcv = supp.map((qs, c) => {
        const mags = mvc[c].map(Math.abs);
        let i1 = 0;
        for (let t = 1; t < mags.length; t++) if (mags[t] < mags[i1]) i1 = t;
        let min2 = Infinity;
        for (let t = 0; t < mags.length; t++) if (t !== i1 && mags[t] < min2) min2 = mags[t];
        const signs = mvc[c].map((v) => (v < 0 ? -1 : 1));
        const total = signs.reduce((a, b) => a * b, 1) * (s[c] ? -1 : 1);
        return qs.map((_, t) => alpha * total * signs[t] * (t === i1 ? min2 : mags[i1]));
      });
      llr = new Array(n).fill(prior);
      supp.forEach((qs, c) => qs.forEach((q, t) => { llr[q] += mcv[c][t]; }));
      mvc = supp.map((qs, c) => qs.map((q, t) => llr[q] - mcv[c][t]));
      guess = guessOf(llr);
      const u = unsatOf(guess);
      hist.llr.push(llr.slice()); hist.guess.push(guess.slice()); hist.unsat.push(u);
      converged = u === 0;
    }
    const probs = hist.llr.map((l) => l.map((v) => 1 / (1 + Math.exp(Math.max(-50, Math.min(50, v))))));
    return { rows, syndrome: s, converged, iterations: it, llr: hist.llr, guess: hist.guess, unsat: hist.unsat, probs };
  }

  // ------------------------------------------------------------------ OSD-0
  /**
   * Ordered-statistics decoding, order 0 (as qdec.decoders.BPOSDDecoder with
   * osd_order=0): sort qubits from "BP thinks most likely flipped" to least
   * (by the given LLRs, stable sort), Gaussian-eliminate H in that column order
   * with the syndrome attached, and solve using only the pivot columns.
   */
  function osd0(code, kind, s, llr) {
    const rows = rowsOf(code, kind);
    const n = code.n, m = rows.length;
    const order = [...Array(n).keys()].sort((a, b) => llr[a] - llr[b]);
    const R = rows.map((r, i) => {
      const row = new Array(n + 1).fill(0);
      code.gens[r].support.forEach((q) => { row[order.indexOf(q)] = 1; });
      row[n] = s[i];
      return row;
    });
    const pivots = [];
    let rr = 0;
    for (let c = 0; c < n && rr < m; c++) {
      let pr = -1;
      for (let i = rr; i < m; i++) if (R[i][c]) { pr = i; break; }
      if (pr < 0) continue;
      [R[rr], R[pr]] = [R[pr], R[rr]];
      for (let i = 0; i < m; i++) if (i !== rr && R[i][c]) for (let t = 0; t <= n; t++) R[i][t] ^= R[rr][t];
      pivots.push(c); rr += 1;
    }
    const sorted = new Array(n).fill(0);
    pivots.forEach((c, i) => { sorted[c] = R[i][n]; });
    const correction = new Set();
    sorted.forEach((v, c) => { if (v) correction.add(order[c]); });
    return { correction, pivots: pivots.map((c) => order[c]), order };
  }

  /**
   * BP, then OSD-0 if BP does not settle - exactly qdec's BPOSDDecoder(osd_order=0):
   * OSD ranks qubits by BP's belief AVERAGED over iterations 1..end (steadier
   * than the last iteration when BP oscillates).
   */
  function bposd(code, errSet, kind, p = 0.05, maxIter = 30, alpha = 0.625) {
    const run = bp(code, errSet, kind, p, maxIter, alpha);
    if (run.converged) {
      const correction = new Set();
      run.guess[run.guess.length - 1].forEach((v, q) => { if (v) correction.add(q); });
      return { bp: run, osd: null, avg: null, correction };
    }
    const L = run.llr.slice(1), n = code.n;
    const avg = new Array(n).fill(0).map((_, q) => L.reduce((a, l) => a + l[q], 0) / L.length);
    const osd = osd0(code, kind, run.syndrome, avg);
    return { bp: run, osd, avg, correction: osd.correction };
  }

  // ------------------------------------------------------------------ result
  /**
   * After decoding: residual = error x correction. Returns
   *   'exact'      the decoder found your error exactly
   *   'stabilizer' different from your error, but the difference is harmless (degeneracy)
   *   'logical'    the difference is a logical operator: a logical error
   * plus which logicals (X-bar_k / Z-bar_k) it flips.
   */
  function verdict(code, residual) {
    const anti = (a, b) => a !== "I" && b !== "I" && a !== b;
    const flips = [];
    code.logicals.forEach((L, k) => {
      ["x", "z"].forEach((t) => {
        let s = 0;
        L[t].forEach(([q, l]) => { if (residual[q] && anti(residual[q], l)) s ^= 1; });
        // a residual that anticommutes with Z-bar_k acts as X-bar_k, and vice versa
        if (s) flips.push((t === "z" ? "X̄" : "Z̄") + k);
      });
    });
    const empty = Object.keys(residual).length === 0;
    return { kind: empty ? "exact" : flips.length ? "logical" : "stabilizer", flips };
  }

  const QDec = { rowsOf, splitError, syndromeOf, lookup, isGraphLike, mwpm, bp, osd0, bposd, verdict };
